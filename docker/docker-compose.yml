# L.O.G.I.C.S. MVP — 3 services only: the LLM, the vector store, and the API.
# Run from repo root: docker compose -f docker/docker-compose.yml --env-file .env up --build
version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - chromadb
    volumes:
      - ../backend:/app

volumes:
  ollama_data:
  chroma_data:
